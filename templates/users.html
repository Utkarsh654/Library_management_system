{% extends "layout.html" %}{% block content %}
<h1>👥 Users</h1>
<div class="card"><div style="overflow:auto"><table>
<tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr>
{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td><span class="badge">{{u.role}}</span></td></tr>{% endfor %}
</table></div></div>
{% endblock %}
